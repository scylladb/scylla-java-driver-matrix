name: Scylla Driver Integration Matrix

on:
  workflow_call:
    inputs:
      driver_ref:
        description: Driver commit SHA to test; latest tag when empty.
        required: false
        type: string
        default: ""
      driver_version:
        description: Version used for matrix patches and ignores; resolved from the tag when empty.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  scylla-integration-tests:
    strategy:
      fail-fast: false
      matrix:
        scylla_version: [LATEST, PRIOR, LTS-LATEST, LTS-PRIOR]
    uses: $/.github/workflows/integration-tests.yml
    with:
      driver_repository: scylladb/java-driver
      driver_type: scylla
      driver_ref: ${{ inputs.driver_ref }}
      driver_version: ${{ inputs.driver_version }}
      scylla_version: ${{ matrix.scylla_version }}
