name: Upstream Release Watch

# Detects a newly published upstream release and runs the regular integration workflow against that
# exact tag.
#
# Upstream releases are the one case no other check reaches. A new Scylla driver tag is caught by the
# release workflow in scylladb/java-driver, and an edited patch is caught by
# changed-driver-version-tests, which runs a full integration leg for every version directory a pull
# request touches — but apache/cassandra-java-driver is tagged by the ASF, so neither a ScyllaDB
# release nor a matrix pull request happens at that moment. The tag simply appears,
# `Run.version_folder` starts falling back to the newest version directory below it, and the first
# sign of trouble is the ~3.5h nightly Jenkins matrix failing before it executes a single test.
#
# Scope, deliberately: only the newest release tag is checked, while the nightly selects the newest
# two (--version-size 2). Widening this would duplicate a line of defence that already exists — a
# second upstream release landing before the first is onboarded is a discrepancy the nightly is there
# to surface.
#
# A missing version directory starts the run; a cache marker stops it repeating. The integration
# workflow takes hours, so each tag gets exactly one: mark-tested records the tag once the run
# reaches a conclusion, success or failure, and the next morning's run finds the marker and does
# nothing. A red run is the signal itself and is already reported — repeating it daily until someone
# onboards the tag would bury it rather than reinforce it. Cancelled and skipped runs record nothing,
# so an infra abort is retried the next day, and an evicted marker (caches expire after 7 days
# unaccessed, though the daily lookup counts as access) costs one extra run at worst. Onboarding the
# directory still makes the whole workflow a no-op, so no marker ever needs cleaning up. Cache scope
# keeps the two triggers apart: a pull request run may read the default branch's markers but writes
# only into its own scope, so it cannot suppress a scheduled run. A workflow_dispatch naming a
# driver_ref bypasses the marker entirely, so any tag can be re-tested on demand.
#
# The decision itself lives in scripts/upstream_release_watch.py and is unit-tested in
# tests/test_upstream_release_watch.py. It has to be tested there: a pull request run only ever sees
# the newest upstream tag as already onboarded, so the branches that matter never execute here. The
# integration job also excludes github.event_name == 'pull_request' explicitly, so a pull request
# can never start the multi-hour run even if that assumption ever stops holding.
#
# This cannot be a webhook: GitHub only delivers those for repositories we own. Polling on a schedule
# is the only mechanism available for a third-party repository.

on:
  schedule:
    # 06:00 UTC = 08:00 CEST / 09:00 IDT. Anchored to the start of the working day, not to the
    # nightly: the Jenkins driver-matrix jobs run at 21:58 UTC, so a run timed just before them would
    # fire when nobody is around to act. Firing in the morning instead means the result is waiting
    # when people arrive, it covers tags published the previous evening, and there is a full working
    # day to add the missing version directory before that night's matrix run.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      driver_ref:
        description: 'driver_ref: upstream tag to test. When empty, the newest release tag is detected.'
        type: string
        default: ''
  pull_request:
    paths:
      - '.github/workflows/upstream-release-watch.yml'
      - 'scripts/upstream_release_watch.py'

permissions:
  contents: read

jobs:
  detect:
    name: Detect new upstream release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      driver_ref: ${{ steps.resolve.outputs.driver_ref }}
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Checkout matrix
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Resolve newest upstream release tag
        if: ${{ inputs.driver_ref == '' }}
        id: get-upstream-tag
        uses: scylladb-actions/get-version@a1dc4fedfb5684242148020b24e4150b1fe7ad08 # v0.4.5
        with:
          source: github-tag
          repo: apache/cassandra-java-driver
          # get-version treats dots as version-component separators, so the three regex components
          # below match only clean three-part releases and the LAST.LAST.LAST selector then picks the
          # newest one. 71 of the 179 upstream tags are not releases at all (`1.0.0-rc1`,
          # `1.0.2-dse2`, bare `2.0`), and extract_n_latest_repo_tags only ever selects N.N.N, so a
          # bare LAST filter could hand us a tag the matrix would never test.
          filters: '^[0-9]+$.^[0-9]+$.^[0-9]+$ and LAST.LAST.LAST'
          github-token: ${{ github.token }}

      - name: Normalize the tag
        id: resolve
        env:
          DRIVER_REF_INPUT: ${{ inputs.driver_ref }}
          DRIVER_REF_LATEST: ${{ steps.get-upstream-tag.outputs.versions }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.upstream_release_watch import resolve, write_outputs

          outputs = resolve(
              os.environ.get("DRIVER_REF_INPUT", ""),
              os.environ.get("DRIVER_REF_LATEST", ""),
          )

          write_outputs(outputs, os.environ["GITHUB_OUTPUT"])
          PY

      # Resolved before the decision, not after, because the key names the tag.
      - name: Look up the tested marker
        id: marker
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .upstream-release-tested
          key: upstream-release-tested-apache-${{ steps.resolve.outputs.driver_ref }}
          lookup-only: true

      - name: Decide whether to run
        id: decide
        env:
          DRIVER_REF: ${{ steps.resolve.outputs.driver_ref }}
          FORCED: ${{ steps.resolve.outputs.forced }}
          HAS_DIRECTORY: ${{ steps.resolve.outputs.has_directory }}
          ALREADY_TESTED: ${{ steps.marker.outputs.cache-hit }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.environ["GITHUB_WORKSPACE"])
          from scripts.upstream_release_watch import as_bool, decide, summarize, write_outputs

          driver_ref = os.environ["DRIVER_REF"]
          forced = as_bool(os.environ.get("FORCED", ""))
          has_directory = as_bool(os.environ.get("HAS_DIRECTORY", ""))
          already_tested = as_bool(os.environ.get("ALREADY_TESTED", ""))

          write_outputs(decide(forced, has_directory, already_tested), os.environ["GITHUB_OUTPUT"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(summarize(driver_ref, forced, has_directory, already_tested))
          PY

  integration:
    name: Integration tests for the new tag
    needs: detect
    # A pull_request run should_run is always false in practice (the newest tag is already onboarded
    # by the time a PR runs), but excluding the trigger explicitly means a PR can never start the
    # multi-hour run even if that stops holding, instead of relying on it as an assumption.
    if: ${{ needs.detect.outputs.should_run == 'true' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/integration-tests.yml
    with:
      driver_repository: apache/cassandra-java-driver
      driver_type: apache
      driver_ref: ${{ needs.detect.outputs.driver_ref }}
      scylla_version: LATEST

  mark-tested:
    name: Record the tag as tested
    needs: [detect, integration]
    # Only a conclusive run counts. A cancelled or skipped one leaves no marker, so the tag comes back
    # tomorrow.
    if: >-
      ${{ always() && needs.detect.outputs.should_run == 'true'
      && (needs.integration.result == 'success' || needs.integration.result == 'failure') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Write the marker
        env:
          DRIVER_REF: ${{ needs.detect.outputs.driver_ref }}
          RESULT: ${{ needs.integration.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          printf '%s %s %s\n' "$DRIVER_REF" "$RESULT" "$RUN_URL" > .upstream-release-tested
          cat .upstream-release-tested

      - name: Save the tested marker
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .upstream-release-tested
          key: upstream-release-tested-apache-${{ needs.detect.outputs.driver_ref }}
